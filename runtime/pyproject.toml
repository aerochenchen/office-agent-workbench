[project]
name = "office-agent-runtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pyyaml>=6.0.1",
  "httpx>=0.27.0",
  "python-docx>=1.1.0",
  "python-pptx>=1.0.0",
  "openpyxl>=3.1.0",
  "xlrd>=2.0.1",
]

[project.scripts]
office-agent-runtime = "office_agent.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]
packaging = ["pyinstaller>=6.3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
