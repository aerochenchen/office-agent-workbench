# Manual Windows NSIS installer build (文书通_*-setup.exe) with WebView2 fixedRuntime.
# Trigger: Actions → Build Windows Installer → Run workflow
# Download: run summary → Artifacts → wenshutong-windows-nsis-fixed-runtime
name: Build Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Cache WebView2 Fixed Runtime cab
        uses: actions/cache@v4
        with:
          path: packaging/webview2-fixed-download/*.cab
          key: webview2-fixed-150.0.4078.105-x64

      - name: Ensure Git Bash on PATH
        shell: pwsh
        run: |
          $gitBin = "C:\Program Files\Git\bin"
          if (-not (Test-Path "$gitBin\bash.exe")) {
            throw "Git Bash not found (required by tauri beforeBuildCommand)"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $gitBin

      - name: Build Windows NSIS installer (fixedRuntime)
        shell: pwsh
        run: .\scripts\build-windows.ps1

      - name: Report installer size
        shell: pwsh
        run: |
          Get-ChildItem "apps\desktop\src-tauri\target\release\bundle\nsis\*-setup.exe" |
            ForEach-Object {
              "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
            }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: wenshutong-windows-nsis-fixed-runtime
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
