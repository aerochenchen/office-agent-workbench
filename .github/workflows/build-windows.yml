# Manual Windows NSIS installer build (文书通_*-setup.exe).
# Trigger: Actions → Build Windows Installer → Run workflow
# Download: run summary → Artifacts → wenshutong-windows-nsis
# 本地部署: 勾选 local_deploy，产物为 文书通_本地部署_*-setup.exe
name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      local_deploy:
        description: "打本地部署版本（禁公网模型，deployment-profile=local）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Ensure Git Bash on PATH
        shell: pwsh
        run: |
          $gitBin = "C:\Program Files\Git\bin"
          if (-not (Test-Path "$gitBin\bash.exe")) {
            throw "Git Bash not found (required by tauri beforeBuildCommand)"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $gitBin

      - name: Build Windows NSIS installer
        shell: pwsh
        env:
          WENSHUTONG_SIGN_PFX_B64: ${{ secrets.WENSHUTONG_SIGN_PFX_B64 }}
          WENSHUTONG_SIGN_PASSWORD: ${{ secrets.WENSHUTONG_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WENSHUTONG_SIGN_PFX_B64)) {
            throw "Missing secret WENSHUTONG_SIGN_PFX_B64. Store a base64 Authenticode PFX that signtool can use on EXE files. A Microsoft Store MSIX dev certificate cannot sign this installer."
          }
          $pfx = Join-Path $env:RUNNER_TEMP "wenshutong-codesign.pfx"
          $b64 = ($env:WENSHUTONG_SIGN_PFX_B64 -replace '\s','')
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($b64))
          $env:WENSHUTONG_SIGN_PFX = $pfx
          if ("${{ inputs.local_deploy }}" -eq "true") {
            .\scripts\build-windows.ps1 -LocalDeploy
          } else {
            .\scripts\build-windows.ps1
          }

      - name: Upload installer artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.local_deploy && 'wenshutong-windows-nsis-local' || 'wenshutong-windows-nsis' }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish installer as GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $nsis = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem -LiteralPath $nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found under $nsis" }
          $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
          if ("${{ inputs.local_deploy }}" -eq "true") {
            $tag = "windows-local-deploy-$stamp"
            $title = "文书通 本地部署 Windows 安装包 ($stamp)"
            $notes = "内网/断公网封装：禁公网模型，deployment-profile=local；WebView2 使用 Fixed Version（安装时不调用 Edge Update，可避开 0xA043050D）。安装后请在设置中填写本机或内网模型地址。"
          } else {
            $tag = "windows-nsis-$stamp"
            $title = "文书通 Windows 安装包 ($stamp)"
            $notes = "标准 Windows NSIS 安装包。"
          }
          gh release create $tag --title $title --notes $notes --latest=false $exe.FullName
