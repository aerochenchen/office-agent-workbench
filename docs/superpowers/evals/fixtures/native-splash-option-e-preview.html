<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文书通 · 原生闪屏方案 E 效果预览</title>
    <style>
      :root {
        --paper: #f3f4f1;
        --ink: #1a1a1a;
        --muted: #4b5563;
        --accent: #2f6f6a;
        --ring: #d5d8d3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
        background:
          radial-gradient(1200px 600px at 20% 10%, #dfe5e2 0%, transparent 55%),
          radial-gradient(900px 500px at 90% 80%, #e8ebe4 0%, transparent 50%),
          #cfd4ce;
        color: var(--ink);
      }

      .stage {
        text-align: center;
      }

      .hint {
        margin: 0 0 1rem;
        font-size: 0.9rem;
        color: #5b6470;
      }

      .splash {
        width: 420px;
        height: 280px;
        margin: 0 auto;
        background: var(--paper);
        border: 1px solid #c9cdc6;
        box-shadow: 0 18px 40px rgba(30, 40, 35, 0.18);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.85rem;
        padding: 1.5rem 1.25rem 1.75rem;
      }

      .logo {
        width: 56px;
        height: 56px;
        object-fit: contain;
      }

      .brand {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .status {
        margin: 0;
        font-size: 1rem;
        color: var(--muted);
      }

      /* Option E: 12 discrete frames, like pre-rendered PNG sprites */
      .spinner {
        width: 36px;
        height: 36px;
        margin-top: 0.35rem;
        position: relative;
      }

      .spinner svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .spinner .track {
        fill: none;
        stroke: var(--ring);
        stroke-width: 2.5;
      }

      .spinner .arc {
        fill: none;
        stroke: var(--accent);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 28 100;
        transform-origin: 18px 18px;
        animation: spin-frames 0.9s steps(12) infinite;
      }

      @keyframes spin-frames {
        to {
          transform: rotate(360deg);
        }
      }

      .note {
        margin: 1.25rem auto 0;
        max-width: 28rem;
        font-size: 0.85rem;
        line-height: 1.55;
        color: #5b6470;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <p class="hint">方案 E 预览 · 预渲染帧风格转圈（steps 动画模拟切帧）</p>
      <div class="splash" role="img" aria-label="文书通启动闪屏效果预览">
        <img class="logo" src="../../../../apps/desktop/public/logo-mark.png" alt="" />
        <h1 class="brand">文书通</h1>
        <p class="status">正在启动本地运行组件…</p>
        <div class="spinner" aria-hidden="true">
          <svg viewBox="0 0 36 36">
            <circle class="track" cx="18" cy="18" r="14" />
            <circle class="arc" cx="18" cy="18" r="14" />
          </svg>
        </div>
      </div>
      <p class="note">
        落地时改为 8～12 张预渲染 PNG（底环 + 短弧、抗锯齿、无中心辐条），原生窗按帧切换。
        观感目标：Logo + 品牌名 + 固定句 + 干净转圈。
      </p>
    </div>
  </body>
</html>
